#================================================================================
# 1. DEVELOPMENT PHASE
#================================================================================
#  1.1 Checkout local feature branch or work directly on 'main'
#      $ git checkout main
#      $ git pull origin main
#
#  1.2 Format code and verify style/tests
#      $ pdm run format
#      $ pdm run check-style
#      $ pdm run pytest
#
#  1.3 Commit changes using Conventional Commit syntax
#      (Semantic Release inspects these messages to determine version bumps)
#
#      Examples:
#        - Bug fix (patch bump):
#          $ git commit -m "fix: adjust inverse geodesic boundary condition calculation"
#
#        - New feature (minor bump):
#          $ git commit -m "feat: add support for vectorized ellipsoidal azimuths"
#
#        - Maintenance/Build (no bump):
#          $ git commit -m "chore: update ruff rules and lockfile dependencies"
#
#================================================================================
# 2. CI AUTOMATED RELEASE (ON PUSH TO MAIN)
#================================================================================
#  2.1 Push commits to 'main'
#      $ git push origin main
#
#  2.2 Continuous Integration runs `python-semantic-release`:
#      - Analyzes commits since last tag
#      - Calculates next version (e.g., 1.1.0 -> 1.1.1 or 1.2.0)
#      - Updates `pyproject.toml` and `src/karney/__init__.py`
#      - Updates `CHANGELOG.md`
#      - Creates Git release tag `v<version>`
#      - Builds distribution wheels/sdist (`pdm build`)
#      - Publishes package to PyPI via Trusted Publishing

[project]
name = "karney"
version = "1.1.0"
description = "Solves the direct and inverse geodesic problem."
authors = [
    {name = "Per A. Brodtkorb", email = "per.andreas.brodtkorb@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
# See https://numpy.org/neps/nep-0029-deprecation_policy.html:
dependencies = [
    "numpy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/pbrod/karney"
Documentation = "https://karney.readthedocs.io/en/latest/"
Repository = "https://github.com/pbrod/karney"

[dependency-groups]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "myst-nb>=1.0.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "hypothesis>=6.98.3",
    "python-semantic-release>=9.0.3",
    "ruff>=0.0.47",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
package-dir = "src"

[tool.pdm.scripts]
build-docs-html = "sphinx-build -b html docs docs/_build/html -d docs/_build/doctrees"
build-docs-latex = "sphinx-build -b latex docs docs/_build/latex -d docs/_build/doctrees"
build-docs-pdf = "sphinx-build -b latexpdf docs docs/_build/latex -d docs/_build/doctrees"
lock_win64 = "pdm lock -L pdm_windows.lock --python 3.13 --strategy no_direct_minimal_versions --platform windows -dG all"
lock_linux = "pdm lock -L pdm_linux.lock --python 3.13 --strategy no_direct_minimal_versions --platform linux -dG all"

format = "ruff format ./src/"
check-style = "ruff check ./src/"

[tool.semantic_release]
commit_parser = "angular"
logging_use_named_masks = true
allow_zero_version = true
tag_format = "v{version}"
version_variables = ["pyproject.toml:version", "src/karney/__init__.py:__version__"]

commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

branch= "main" # branch to make releases of
build_command = "pip install pdm && pdm build"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    ".*\\n\\nAutomatically generated by python-semantic-release",
    "chore: pre-commit autoupdate\n\nAutomatically generated by pre-commit.ci",
]

[tool.semantic_release.commit_parser_options]
allowed_types = [
    "build", "chore", "ci", "docs", "feat", "fix",
    "perf", "style", "refactor", "test",
]
minor_types = ["feat"]
patch_types = ["fix", "perf"]


# chore: Changes to the build process or auxiliary tools and libraries such as documentation generation
# docs: Documentation only changes
# feat: A new feature
# fix: A bug fix
# perf: A code change that improves performance
# refactor: A code change that neither fixes a bug nor adds a feature
# style: Changes that do not affect the meaning of the code (white-space, formatting, missing semi-colons, etc)
# test: Adding missing or correcting existing tests

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E4",   # pycodestyle import checks
    "E7",   # pycodestyle statement checks
    "E9",   # pycodestyle runtime checks
    "E501", # pycodestyle line length
    "F",    # PyFlakes
    "I",    # isort
    "Q",    # flake8-quotes
]

[tool.ruff.format]
docstring-code-line-length = 100

[tool.pytest.ini_options]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ELLIPSIS"]
testpaths = ["src"]